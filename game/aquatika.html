<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aquatika Prototype (HTML/JS)</title>
  <style>
    body {
      margin: 0;
      background: #e9edf3;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 18px;
      color: #1b2430;
    }
    .wrap {
      background: #f7f9fc;
      border: 1px solid #cfd7e3;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 14px;
    }
    canvas {
      display: block;
      background: #f5f8fc;
      border-radius: 12px;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="game"></canvas>
  </div>

  <script>
    // =========================
    // Constants
    // =========================
    const EMPTY = 0;
    const ROCK = 10;
    const GOAL = 20;

    const FLYING = 1;
    const SHARK = 2;
    const OCTOPUS = 5;

    const OCTO_SELF_FLY = 11;
    const OCTO_SELF_SHARK = 12;
    const OCTO_ENEMY_FLY = 13;
    const OCTO_ENEMY_SHARK = 14;

    const ROWS = 5;
    const COLS = 12;
    const NUM_LAYOUTS = 1680;

    const BG_COLOR = [245, 248, 252];
    const GRID_COLOR = [25, 35, 45];
    const WATER_COLOR = [217, 242, 255];
    const ROCK_COLOR = [100, 100, 100];
    const GOAL_COLOR = [255, 217, 102];
    const TEXT_COLOR = [20, 25, 35];
    const A_COLOR = [30, 90, 180];
    const B_COLOR = [180, 60, 60];
    const A_TERRITORY_COLOR = [170, 205, 234];
    const B_TERRITORY_COLOR = [236, 188, 188];
    const SELECT_COLOR = [255, 180, 0];
    const LEGAL_COLOR = [90, 200, 120];
    const CAPTURE_COLOR = [220, 120, 120];
    const WIN_COLOR = [90, 90, 255];
    const BUTTON_COLOR = [232, 236, 242];
    const BUTTON_ACTIVE = [200, 225, 255];
    const BUTTON_BORDER = [80, 90, 110];
    const INPUT_BG = [255, 255, 255];
    const INPUT_ACTIVE = [255, 248, 210];
    const ERROR_COLOR = [180, 50, 50];
    const COVER_COLOR = [180, 120, 220];
    const DROP_COLOR = [120, 200, 220];

    const CELL = 72;
    const PADDING = 24;
    const TOP_UI = 210;

    const WINDOW_W = COLS * CELL + PADDING * 2;
    const WINDOW_H = ROWS * CELL + PADDING * 2 + TOP_UI;

    // =========================
    // Canvas setup
    // =========================
    const canvas = document.getElementById("game");
    canvas.width = WINDOW_W;
    canvas.height = WINDOW_H;
    const ctx = canvas.getContext("2d");

    function rgb(c) {
      return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
    }

    function sign(x) {
      if (x > 0) return 1;
      if (x < 0) return -1;
      return 0;
    }

    function clamp(x, lo = 0, hi = 255) {
      return Math.max(lo, Math.min(hi, Math.floor(x)));
    }

    function lighten(color, amount = 28) {
      return [clamp(color[0] + amount), clamp(color[1] + amount), clamp(color[2] + amount)];
    }

    function darken(color, amount = 28) {
      return [clamp(color[0] - amount), clamp(color[1] - amount), clamp(color[2] - amount)];
    }

    function teamColors(side) {
      const base = side === 1 ? A_COLOR : B_COLOR;
      const edge = darken(base, 45);
      const glow = lighten(base, 55);
      return [base, edge, glow];
    }

    // =========================
    // Combinatorics / layout
    // =========================
    function factorial(n) {
      let r = 1;
      for (let i = 2; i <= n; i++) r *= i;
      return r;
    }

    function multinomialCount(counts) {
      const total = Object.values(counts).reduce((a, b) => a + b, 0);
      let result = factorial(total);
      for (const v of Object.values(counts)) {
        result /= factorial(v);
      }
      return result;
    }

    function unrank3x3Layout(rank) {
      if (!(0 <= rank && rank < NUM_LAYOUTS)) {
        throw new Error(`rank must be in 0..${NUM_LAYOUTS - 1}`);
      }

      const counts = { S: 3, O: 3, F: 3 };
      const symbols = ["S", "O", "F"];
      const result = [];

      for (let i = 0; i < 9; i++) {
        for (const sym of symbols) {
          if (counts[sym] === 0) continue;
          counts[sym] -= 1;
          const cnt = multinomialCount(counts);
          if (rank < cnt) {
            result.push(sym);
            break;
          }
          rank -= cnt;
          counts[sym] += 1;
        }
      }
      return result;
    }

    function toGrid(layout) {
      return [layout.slice(0, 3), layout.slice(3, 6), layout.slice(6, 9)];
    }

    function mirrorLR(grid) {
      return grid.map(row => [...row].reverse());
    }

    function layoutFromUiNumber(number) {
      if (!(1 <= number && number <= NUM_LAYOUTS)) {
        throw new Error(`number must be in 1..${NUM_LAYOUTS}`);
      }
      return toGrid(unrank3x3Layout(number - 1));
    }

    function normalizeLayoutText(text) {
      return text.trim().toUpperCase().replaceAll(" ", "");
    }

    function parseLayoutSpec(spec) {
      const s = normalizeLayoutText(spec);
      if (!s) throw new Error("빈 입력입니다.");

      if (/^\d+$/.test(s)) {
        return layoutFromUiNumber(Number(s));
      }

      const parts = s.split("/");
      if (parts.length === 3 && parts.every(p => p.length === 3)) {
        const chars = parts.flatMap(row => row.split(""));
        if (chars.some(ch => !["S", "F", "O"].includes(ch))) {
          throw new Error("S, F, O만 사용할 수 있습니다.");
        }
        if (
          chars.filter(ch => ch === "S").length !== 3 ||
          chars.filter(ch => ch === "F").length !== 3 ||
          chars.filter(ch => ch === "O").length !== 3
        ) {
          throw new Error("S, F, O는 각각 3개씩이어야 합니다.");
        }
        return parts.map(row => row.split(""));
      }

      throw new Error("번호(1~1680) 또는 SFO/SFO/SFO 형식으로 입력하세요.");
    }

    function gridToText(grid) {
      return grid.map(row => row.join("")).join("/");
    }

    function findLayoutNumberFromGrid(grid) {
      const target = grid.flat();
      const counts = { S: 3, O: 3, F: 3 };
      const symbols = ["S", "O", "F"];
      let rank = 0;

      for (const ch of target) {
        for (const sym of symbols) {
          if (counts[sym] === 0) continue;
          if (sym === ch) {
            counts[sym] -= 1;
            break;
          }
          counts[sym] -= 1;
          rank += multinomialCount(counts);
          counts[sym] += 1;
        }
      }
      return rank + 1;
    }

    function displayLayoutNumber(grid, side) {
      const canonical = side === "B" ? mirrorLR(grid) : grid;
      return findLayoutNumberFromGrid(canonical);
    }

    function randomGrid() {
      return layoutFromUiNumber(1 + Math.floor(Math.random() * NUM_LAYOUTS));
    }

    // =========================
    // Board / pieces
    // =========================
    function applyTwoLayouts(board, aGrid, bGrid) {
      const pieceMapA = { S: SHARK, O: OCTOPUS, F: FLYING };
      const pieceMapB = { S: -SHARK, O: -OCTOPUS, F: -FLYING };

      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
          board[1 + i][1 + j] = pieceMapA[aGrid[i][j]];
          board[1 + i][8 + j] = pieceMapB[bGrid[i][j]];
        }
      }
    }

    function makeInitialBoard(aGrid, bGrid) {
      const board = Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY));

      for (let r = 0; r < ROWS; r++) {
        if (r !== 2) {
          board[r][0] = ROCK;
          board[r][11] = ROCK;
        }
      }

      board[2][0] = GOAL;
      board[2][11] = GOAL;
      applyTwoLayouts(board, aGrid, bGrid);
      return board;
    }

    function sideOf(cell) {
      return sign(cell);
    }

    function absCode(cell) {
      return Math.abs(cell);
    }

    function isPiece(cell) {
      return cell !== EMPTY && cell !== ROCK && cell !== GOAL;
    }

    function isOctopus(cell) {
      return [OCTOPUS, OCTO_SELF_FLY, OCTO_SELF_SHARK, OCTO_ENEMY_FLY, OCTO_ENEMY_SHARK].includes(Math.abs(cell));
    }

    function isShark(cell) {
      return Math.abs(cell) === SHARK;
    }

    function isFlying(cell) {
      return Math.abs(cell) === FLYING;
    }

    function isOctopusCarrying(cell) {
      return [OCTO_SELF_FLY, OCTO_SELF_SHARK, OCTO_ENEMY_FLY, OCTO_ENEMY_SHARK].includes(Math.abs(cell));
    }

    function carriedPieceInfo(cell) {
      const c = Math.abs(cell);
      if (c === OCTO_SELF_FLY) return ["ally", FLYING];
      if (c === OCTO_SELF_SHARK) return ["ally", SHARK];
      if (c === OCTO_ENEMY_FLY) return ["enemy", FLYING];
      if (c === OCTO_ENEMY_SHARK) return ["enemy", SHARK];
      return null;
    }

    function makeOctopusCode(octoSide, carriedSide, carriedPiece) {
      if (octoSide === carriedSide) {
        if (carriedPiece === FLYING) return octoSide * OCTO_SELF_FLY;
        if (carriedPiece === SHARK) return octoSide * OCTO_SELF_SHARK;
      } else {
        if (carriedPiece === FLYING) return octoSide * OCTO_ENEMY_FLY;
        if (carriedPiece === SHARK) return octoSide * OCTO_ENEMY_SHARK;
      }
      throw new Error("Invalid carried piece for octopus");
    }

    function octopusDropPiece(cell) {
      const info = carriedPieceInfo(cell);
      if (!info) return null;
      const [carrySideDesc, carryPiece] = info;
      const octoSide = sideOf(cell);
      const carriedSide = carrySideDesc === "ally" ? octoSide : -octoSide;
      return carriedSide * carryPiece;
    }

    function octopusBasePiece(cell) {
      return sideOf(cell) * OCTOPUS;
    }

    function winningDisplayPiece(cell, moveKind = null) {
      if (moveKind === "drop_and_win") return octopusBasePiece(cell);
      return cell;
    }

    function inTeamTerritory(r, c) {
      return (1 <= r && r <= 3) && ((1 <= c && c <= 3) || (8 <= c && c <= 10));
    }

    function territoryOwner(c) {
      if (1 <= c && c <= 3) return 1;
      if (8 <= c && c <= 10) return -1;
      return 0;
    }

    function enemyGoalCol(side) {
      return side === 1 ? 11 : 0;
    }

    function inBounds(r, c) {
      return 0 <= r && r < ROWS && 0 <= c && c < COLS;
    }

    function commonMoveDirs(side) {
      const forward = side === 1 ? [0, 1] : [0, -1];
      const up = [-1, 0];
      const down = [1, 0];
      const forwardUp = side === 1 ? [-1, 1] : [-1, -1];
      const forwardDown = side === 1 ? [1, 1] : [1, -1];
      return [forward, up, down, forwardUp, forwardDown];
    }

    function addFlyingChainJumps(board, r, c, side, moves) {
      const seen = new Set();

      for (const [dr, dc] of commonMoveDirs(side)) {
        let curR = r;
        let curC = c;

        while (true) {
          const midR = curR + dr;
          const midC = curC + dc;
          const landR = curR + 2 * dr;
          const landC = curC + 2 * dc;

          if (!inBounds(midR, midC) || !inBounds(landR, landC)) break;

          const middle = board[midR][midC];
          const landing = board[landR][landC];

          if (!isPiece(middle)) break;
          if (landing === ROCK) break;

          if (landing === GOAL) {
            if (landC === enemyGoalCol(side)) {
              const key = `${landR},${landC}|win_jump`;
              if (!seen.has(key)) {
                moves.push({ to: [landR, landC], kind: "win_jump" });
                seen.add(key);
              }
            }
            break;
          }

          if (landing !== EMPTY) break;

          const key = `${landR},${landC}|jump`;
          if (!seen.has(key)) {
            moves.push({ to: [landR, landC], kind: "jump" });
            seen.add(key);
          }

          curR = landR;
          curC = landC;
        }
      }
    }

    function getLegalMoves(board, r, c, liftMode = false) {
      const cell = board[r][c];
      if (!isPiece(cell)) return [];

      const side = sideOf(cell);
      const absPiece = absCode(cell);
      const carrying = isOctopusCarrying(cell);
      const moves = [];

      for (const [dr, dc] of commonMoveDirs(side)) {
        const nr = r + dr;
        const nc = c + dc;
        if (!inBounds(nr, nc)) continue;

        const dst = board[nr][nc];
        if (dst === ROCK) continue;

        if (dst === GOAL) {
          if (nc === enemyGoalCol(side)) {
            if (carrying && liftMode) {
              moves.push({ to: [nr, nc], kind: "drop_and_win" });
            } else {
              moves.push({ to: [nr, nc], kind: "win" });
            }
          }
          continue;
        }

        if (dst === EMPTY) {
          if (carrying && liftMode) {
            moves.push({ to: [nr, nc], kind: "drop_move" });
          } else {
            moves.push({ to: [nr, nc], kind: "move" });
          }
          continue;
        }

        if (sideOf(dst) === side) {
          if (absPiece === OCTOPUS && !carrying && [SHARK, FLYING].includes(absCode(dst))) {
            moves.push({ to: [nr, nc], kind: "cover" });
          } else if (isOctopus(cell) && carrying && [SHARK, FLYING].includes(absCode(dst))) {
            moves.push({ to: [nr, nc], kind: "cover_drop" });
          }
          continue;
        }

        if (isShark(cell)) {
          moves.push({ to: [nr, nc], kind: "capture" });
        } else if (absPiece === OCTOPUS && !carrying && [SHARK, FLYING].includes(absCode(dst))) {
          moves.push({ to: [nr, nc], kind: "cover" });
        } else if (isOctopus(cell) && carrying && [SHARK, FLYING].includes(absCode(dst))) {
          moves.push({ to: [nr, nc], kind: "cover_drop" });
        }
      }

      if (isFlying(cell)) {
        addFlyingChainJumps(board, r, c, side, moves);
      }

      return moves;
    }

    function cloneBoard(board) {
      return board.map(row => [...row]);
    }

    function applyMove(board, src, move, liftMode = false) {
      const [r, c] = src;
      const [nr, nc] = move.to;
      const cell = board[r][c];
      const kind = move.kind;
      const side = sideOf(cell);

      const newBoard = cloneBoard(board);
      let winner = null;

      if (["win", "win_jump", "drop_and_win"].includes(kind)) {
        if (kind === "drop_and_win") {
          const dropped = octopusDropPiece(cell);
          newBoard[r][c] = dropped !== null ? dropped : EMPTY;
        } else {
          newBoard[r][c] = EMPTY;
        }
        winner = side;
        return [newBoard, winner];
      }

      if (kind === "move" || kind === "jump") {
        newBoard[nr][nc] = cell;
        newBoard[r][c] = EMPTY;
        return [newBoard, winner];
      }

      if (kind === "capture") {
        newBoard[nr][nc] = cell;
        newBoard[r][c] = EMPTY;
        return [newBoard, winner];
      }

      if (kind === "cover") {
        const dst = newBoard[nr][nc];
        const carriedSide = sideOf(dst);
        const carriedPiece = absCode(dst);
        newBoard[nr][nc] = makeOctopusCode(side, carriedSide, carriedPiece);
        newBoard[r][c] = EMPTY;
        return [newBoard, winner];
      }

      if (kind === "cover_drop") {
        const dst = newBoard[nr][nc];
        const carriedSide = sideOf(dst);
        const carriedPiece = absCode(dst);
        const dropped = octopusDropPiece(cell);
        newBoard[r][c] = dropped !== null ? dropped : EMPTY;
        newBoard[nr][nc] = makeOctopusCode(side, carriedSide, carriedPiece);
        return [newBoard, winner];
      }

      if (kind === "drop_move") {
        const dropped = octopusDropPiece(cell);
        newBoard[r][c] = dropped !== null ? dropped : EMPTY;
        newBoard[nr][nc] = octopusBasePiece(cell);
        return [newBoard, winner];
      }

      throw new Error(`Unknown move kind: ${kind}`);
    }

    // =========================
    // Geometry / UI helpers
    // =========================
    function boardToScreen(r, c) {
      const x = PADDING + c * CELL;
      const y = TOP_UI + PADDING + r * CELL;
      return { x, y, w: CELL, h: CELL };
    }

    function pointInRect(px, py, rect) {
      return px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h;
    }

    function screenToBoard(x, y) {
      const bx = x - PADDING;
      const by = y - (TOP_UI + PADDING);
      if (bx < 0 || by < 0) return null;
      const c = Math.floor(bx / CELL);
      const r = Math.floor(by / CELL);
      if (0 <= r && r < ROWS && 0 <= c && c < COLS) return [r, c];
      return null;
    }

    function roundRect(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function fillRoundRect(ctx, x, y, w, h, r, color) {
      roundRect(ctx, x, y, w, h, r);
      ctx.fillStyle = rgb(color);
      ctx.fill();
    }

    function strokeRoundRect(ctx, x, y, w, h, r, color, width = 1) {
      roundRect(ctx, x, y, w, h, r);
      ctx.strokeStyle = rgb(color);
      ctx.lineWidth = width;
      ctx.stroke();
    }

    function drawText(text, x, y, opts = {}) {
      const {
        color = TEXT_COLOR,
        size = 20,
        bold = false,
        align = "left",
        baseline = "alphabetic"
      } = opts;
      ctx.font = `${bold ? "700" : "400"} ${size}px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
      ctx.fillStyle = rgb(color);
      ctx.textAlign = align;
      ctx.textBaseline = baseline;
      ctx.fillText(text, x, y);
    }

    function drawTextCenter(text, rect, opts = {}) {
      drawText(text, rect.x + rect.w / 2, rect.y + rect.h / 2, {
        ...opts,
        align: "center",
        baseline: "middle"
      });
    }

    function drawButton(rect, text, active = false) {
      const color = active ? BUTTON_ACTIVE : BUTTON_COLOR;
      fillRoundRect(ctx, rect.x, rect.y, rect.w, rect.h, 10, color);
      strokeRoundRect(ctx, rect.x, rect.y, rect.w, rect.h, 10, BUTTON_BORDER, 2);
      drawTextCenter(text, rect, { color: TEXT_COLOR, size: 18 });
    }

    function drawInputBox(rect, text, active = false) {
      const color = active ? INPUT_ACTIVE : INPUT_BG;
      fillRoundRect(ctx, rect.x, rect.y, rect.w, rect.h, 8, color);
      strokeRoundRect(ctx, rect.x, rect.y, rect.w, rect.h, 8, BUTTON_BORDER, 2);
      drawText(text, rect.x + 8, rect.y + rect.h / 2, {
        size: 18,
        color: TEXT_COLOR,
        baseline: "middle"
      });
    }

    function moveKindColor(kind) {
      if (kind.includes("win")) return WIN_COLOR;
      if (kind === "capture") return CAPTURE_COLOR;
      if (kind === "cover" || kind === "cover_drop") return COVER_COLOR;
      if (kind === "drop_move") return DROP_COLOR;
      return LEGAL_COLOR;
    }

    // =========================
    // Piece drawing
    // =========================
    function drawPieceShadow(rect) {
      ctx.save();
      ctx.fillStyle = "rgba(205, 212, 220, 0.9)";
      ctx.beginPath();
      ctx.ellipse(
        rect.x + rect.w / 2 + 3,
        rect.y + rect.h / 2 + 5,
        (rect.w - 18) / 2,
        (rect.h - 26) / 2,
        0,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.restore();
    }

    function drawFlyingIcon(rect, base, edge, glow) {
      const cx = rect.x + rect.w / 2;
      const cy = rect.y + rect.h / 2;
      const w = rect.w;
      const h = rect.h;

      const leftWing = [
        [cx - w * 0.04, cy - h * 0.02],
        [cx - w * 0.36, cy - h * 0.20],
        [cx - w * 0.22, cy + h * 0.04],
      ];
      const rightWing = [
        [cx + w * 0.04, cy - h * 0.02],
        [cx + w * 0.36, cy - h * 0.20],
        [cx + w * 0.22, cy + h * 0.04],
      ];
      const body = [
        [cx, cy - h * 0.27],
        [cx + w * 0.18, cy],
        [cx, cy + h * 0.27],
        [cx - w * 0.18, cy],
      ];

      function poly(points, fill, stroke, lw = 2) {
        ctx.beginPath();
        ctx.moveTo(points[0][0], points[0][1]);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
        ctx.closePath();
        ctx.fillStyle = rgb(fill);
        ctx.fill();
        ctx.strokeStyle = rgb(stroke);
        ctx.lineWidth = lw;
        ctx.stroke();
      }

      poly(leftWing, glow, edge);
      poly(rightWing, glow, edge);
      poly(body, base, edge);

      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(cx, cy - h * 0.05, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSharkIcon(rect, base, edge, glow, side) {
      const cx = rect.x + rect.w / 2;
      const cy = rect.y + rect.h / 2;
      const w = rect.w;
      const h = rect.h;
      const facing = side === 1 ? 1 : -1;

      const body = [
        [cx - facing * w * 0.24, cy - h * 0.14],
        [cx + facing * w * 0.16, cy - h * 0.14],
        [cx + facing * w * 0.30, cy],
        [cx + facing * w * 0.16, cy + h * 0.14],
        [cx - facing * w * 0.24, cy + h * 0.14],
        [cx - facing * w * 0.34, cy],
      ];
      const fin = [
        [cx - facing * w * 0.01, cy - h * 0.14],
        [cx + facing * w * 0.07, cy - h * 0.34],
        [cx + facing * w * 0.13, cy - h * 0.12],
      ];
      const tail = [
        [cx - facing * w * 0.28, cy],
        [cx - facing * w * 0.42, cy - h * 0.16],
        [cx - facing * w * 0.40, cy],
        [cx - facing * w * 0.42, cy + h * 0.16],
      ];

      function poly(points, fill, stroke, lw = 2) {
        ctx.beginPath();
        ctx.moveTo(points[0][0], points[0][1]);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
        ctx.closePath();
        ctx.fillStyle = rgb(fill);
        ctx.fill();
        ctx.strokeStyle = rgb(stroke);
        ctx.lineWidth = lw;
        ctx.stroke();
      }

      poly(body, base, edge);
      poly(fin, glow, edge);
      poly(tail, glow, edge);

      const eyeX = cx + facing * w * 0.18;
      const eyeY = cy - h * 0.04;
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(eyeX, eyeY, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = rgb(edge);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(eyeX, eyeY, 1, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawOctopusIcon(rect, base, edge, glow) {
      const cx = rect.x + rect.w / 2;
      const cy = rect.y + rect.h / 2;
      const w = rect.w;
      const h = rect.h;

      const headCx = cx;
      const headCy = cy - h * 0.08;
      const headR = Math.floor(Math.min(w, h) * 0.20);

      ctx.fillStyle = rgb(base);
      ctx.beginPath();
      ctx.arc(headCx, headCy, headR, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = rgb(edge);
      ctx.lineWidth = 2;
      ctx.stroke();

      const tentacleOffsets = [-0.20, -0.12, -0.04, 0.04, 0.12, 0.20];
      for (const dx of tentacleOffsets) {
        const x0 = cx + w * dx;
        const y0 = cy + h * 0.02;
        const x1 = cx + w * dx * 1.08;
        const y1 = cy + h * 0.24;

        ctx.strokeStyle = rgb(glow);
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();

        ctx.strokeStyle = rgb(edge);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();
      }

      const eyes = [
        [cx - w * 0.07, cy - h * 0.11],
        [cx + w * 0.07, cy - h * 0.11]
      ];
      for (const [ex, ey] of eyes) {
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(ex, ey, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = rgb(edge);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(ex, ey, 1, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawCarryBadge(rect, cell, liftMode, viewerSide) {
      const info = carriedPieceInfo(cell);
      if (!info) return;
      if (!liftMode) return;
      if (sideOf(cell) !== viewerSide) return;

      const [carrySideDesc, carryPiece] = info;
      const octoSide = sideOf(cell);
      const carriedSide = carrySideDesc === "ally" ? octoSide : -octoSide;
      const badgeText = carryPiece === FLYING ? "F" : "S";

      const bx = rect.x + rect.w - 14;
      const by = rect.y + 14;
      const badgeR = 12;

      const [fill] = teamColors(carriedSide);
      const bg = lighten(fill, 70);
      const border = darken(fill, 55);
      const textColor = darken(fill, 80);

      ctx.fillStyle = rgb(bg);
      ctx.beginPath();
      ctx.arc(bx, by, badgeR, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = rgb(border);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(bx, by, badgeR, 0, Math.PI * 2);
      ctx.stroke();

      drawText(badgeText, bx, by, {
        size: 16,
        bold: true,
        color: textColor,
        align: "center",
        baseline: "middle"
      });
    }

    function drawPiece(rect, cell, liftMode = false, viewerSide = 1) {
      if (!isPiece(cell)) return;

      const side = sideOf(cell);
      const [base, edge, glow] = teamColors(side);

      const pieceRect = {
        x: rect.x + 7,
        y: rect.y + 7,
        w: rect.w - 14,
        h: rect.h - 14
      };

      drawPieceShadow(pieceRect);

      const ringRect = {
        x: pieceRect.x + 7,
        y: pieceRect.y - 9,
        w: pieceRect.w - 14,
        h: pieceRect.h + 18
      };

      ctx.fillStyle = rgb(lighten(base, 90));
      ctx.beginPath();
      ctx.ellipse(
        ringRect.x + ringRect.w / 2,
        ringRect.y + ringRect.h / 2,
        ringRect.w / 2,
        ringRect.h / 2,
        0, 0, Math.PI * 2
      );
      ctx.fill();

      ctx.strokeStyle = rgb(edge);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(
        ringRect.x + ringRect.w / 2,
        ringRect.y + ringRect.h / 2,
        ringRect.w / 2,
        ringRect.h / 2,
        0, 0, Math.PI * 2
      );
      ctx.stroke();

      const c = absCode(cell);
      const baseKind = isOctopus(cell) ? OCTOPUS : c;

      if (baseKind === FLYING) {
        drawFlyingIcon(pieceRect, base, edge, glow);
      } else if (baseKind === SHARK) {
        drawSharkIcon(pieceRect, base, edge, glow, side);
      } else if (baseKind === OCTOPUS) {
        drawOctopusIcon(pieceRect, base, edge, glow);
      }

      if (isOctopusCarrying(cell) && liftMode && side === viewerSide) {
        drawCarryBadge(rect, cell, liftMode, viewerSide);
      }
    }

    function drawMoveMarker(rect, kind) {
      const color = moveKindColor(kind);
      const cx = rect.x + rect.w / 2;
      const cy = rect.y + rect.h / 2;

      ctx.strokeStyle = rgb(color);
      ctx.fillStyle = rgb(color);

      if (kind.includes("win")) {
        const inner = { x: rect.x + 10, y: rect.y + 10, w: rect.w - 20, h: rect.h - 20 };
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.ellipse(inner.x + inner.w / 2, inner.y + inner.h / 2, inner.w / 2, inner.h / 2, 0, 0, Math.PI * 2);
        ctx.stroke();
        return;
      }

      if (kind === "capture") {
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(cx - 14, cy - 14);
        ctx.lineTo(cx + 14, cy + 14);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(cx + 14, cy - 14);
        ctx.lineTo(cx - 14, cy + 14);
        ctx.stroke();
        return;
      }

      if (kind === "cover" || kind === "cover_drop") {
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, 14, 0, Math.PI * 2);
        ctx.stroke();

        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, 6, 0, Math.PI * 2);
        ctx.stroke();
        return;
      }

      if (kind === "drop_move") {
        fillRoundRect(ctx, cx - 10, cy - 10, 20, 20, 6, color);
        return;
      }

      ctx.beginPath();
      ctx.arc(cx, cy, 10, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawLayoutPreview(aGrid, bGrid) {
      const previewX = WINDOW_W - 250;
      const previewY = 14;
      const size = 22;
      const gap = 4;

      let aNumText = "-";
      let bNumText = "-";
      try { aNumText = String(displayLayoutNumber(aGrid, "A")); } catch (e) {}
      try { bNumText = String(displayLayoutNumber(bGrid, "B")); } catch (e) {}

      drawText("A / B preview", previewX, previewY + 18, { size: 20, color: TEXT_COLOR });
      drawText(`A #${aNumText}`, previewX, previewY + 46, { size: 18, color: A_COLOR });
      drawText(`B #${bNumText}`, previewX + 118, previewY + 46, { size: 18, color: B_COLOR });

      for (const [grid, x0] of [[aGrid, previewX], [bGrid, previewX + 118]]) {
        for (let i = 0; i < 3; i++) {
          for (let j = 0; j < 3; j++) {
            const rect = {
              x: x0 + j * (size + gap),
              y: previewY + 56 + i * (size + gap),
              w: size,
              h: size
            };
            fillRoundRect(ctx, rect.x, rect.y, rect.w, rect.h, 4, [240, 244, 248]);
            strokeRoundRect(ctx, rect.x, rect.y, rect.w, rect.h, 4, BUTTON_BORDER, 1);
            drawTextCenter(grid[i][j], rect, { size: 14, color: TEXT_COLOR });
          }
        }
      }
    }

    // =========================
    // Controls
    // =========================
    function createControls() {
      const inputA = { x: PADDING + 24, y: 86, w: 240, h: 34 };
      const inputB = { x: PADDING + 24, y: 128, w: 240, h: 34 };
      const buttons = {
        random_a: { x: PADDING + 276, y: 86, w: 72, h: 34 },
        random_b: { x: PADDING + 276, y: 128, w: 72, h: 34 },
        mirror_b: { x: PADDING + 358, y: 128, w: 78, h: 34 },
        number:   { x: PADDING + 452, y: 128, w: 58, h: 34 },
        string:   { x: PADDING + 520, y: 128, w: 66, h: 34 },
        apply:    { x: PADDING + 358, y: 86, w: 84, h: 34 },
        lift:     { x: PADDING + 452, y: 86, w: 58, h: 34 },
        reset:    { x: PADDING + 520, y: 86, w: 66, h: 34 },
      };
      return {
        inputA,
        inputB,
        buttons,
        activeInput: null
      };
    }

    function resetGame(aGrid, bGrid) {
      return {
        board: makeInitialBoard(aGrid, bGrid),
        currentTurn: 1,
        liftMode: false,
        selected: null,
        legalMoves: [],
        winner: null,
        winningPiece: null,
        winningGoal: null
      };
    }

    function resolveInputPair(aText, bText, mirrorB) {
      const aGrid = parseLayoutSpec(aText);
      let bGrid;
      if (mirrorB) {
        bGrid = mirrorLR(aGrid);
      } else {
        if (/^\d+$/.test(bText.trim())) {
          bGrid = mirrorLR(parseLayoutSpec(bText));
        } else {
          bGrid = parseLayoutSpec(bText);
        }
      }
      return [aGrid, bGrid];
    }

    // =========================
    // Global state
    // =========================
    const controls = createControls();

    let aText = "1";
    let bText = "1";
    let mirrorB = true;
    let errorMsg = "";

    let aGrid, bGrid, state;

    function initState() {
      [aGrid, bGrid] = resolveInputPair(aText, bText, mirrorB);
      state = resetGame(aGrid, bGrid);
    }

    initState();

    // =========================
    // Drawing
    // =========================
    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = rgb(BG_COLOR);
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const status = state.winner !== null
        ? `Winner: ${state.winner === 1 ? "A" : "B"}`
        : `Turn: ${state.currentTurn === 1 ? "A" : "B"} | Lift: ${state.liftMode ? "ON" : "OFF"}`;

      drawText(`Aquatika prototype | ${status}`, PADDING, 18, {
        size: 24, bold: true, color: TEXT_COLOR, baseline: "top"
      });
      drawText("A/B 입력: 1~1680 또는 SFO/SFO/SFO", PADDING, 54, {
        size: 18, color: [70, 80, 95], baseline: "top"
      });

      drawText("A", PADDING, 92, { size: 18, color: A_COLOR, baseline: "top" });
      drawText("B", PADDING, 134, { size: 18, color: B_COLOR, baseline: "top" });

      drawInputBox(controls.inputA, aText, controls.activeInput === "a");
      drawInputBox(controls.inputB, bText, controls.activeInput === "b");

      const labels = {
        random_a: "A랜덤",
        random_b: "B랜덤",
        mirror_b: "B대칭",
        apply: "적용",
        lift: "Lift",
        reset: "리셋",
        number: "숫자",
        string: "기호"
      };

      for (const [name, rect] of Object.entries(controls.buttons)) {
        const active = (name === "lift" && state.liftMode) || (name === "mirror_b" && mirrorB);
        drawButton(rect, labels[name], active);
      }

      if (errorMsg) {
        drawText(errorMsg, PADDING + 448, 134, {
          size: 18,
          color: ERROR_COLOR,
          baseline: "top"
        });
      }

      drawLayoutPreview(aGrid, bGrid);

      const legalLookup = new Map();
      for (const mv of state.legalMoves) {
        legalLookup.set(`${mv.to[0]},${mv.to[1]}`, mv.kind);
      }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const rect = boardToScreen(r, c);
          const cell = state.board[r][c];

          let face;
          if (cell === ROCK) face = ROCK_COLOR;
          else if (cell === GOAL) face = GOAL_COLOR;
          else face = WATER_COLOR;

          if (cell !== ROCK && cell !== GOAL && inTeamTerritory(r, c)) {
            const owner = territoryOwner(c);
            face = owner === 1 ? A_TERRITORY_COLOR : B_TERRITORY_COLOR;
          }

          ctx.fillStyle = rgb(face);
          ctx.fillRect(rect.x, rect.y, rect.w, rect.h);

          ctx.fillStyle = rgb(lighten(face, 10));
          ctx.fillRect(rect.x, rect.y, rect.w, Math.floor(rect.h / 2));

          ctx.strokeStyle = rgb(GRID_COLOR);
          ctx.lineWidth = 2;
          ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);

          if (state.selected && state.selected[0] === r && state.selected[1] === c) {
            fillRoundRect(ctx, rect.x + 4, rect.y + 4, rect.w - 8, rect.h - 8, 10, [255, 229, 160]);
            ctx.strokeStyle = rgb(SELECT_COLOR);
            ctx.lineWidth = 4;
            ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
          }

          const key = `${r},${c}`;

          if (cell === GOAL) {
            if (state.winner !== null &&
                state.winningGoal &&
                state.winningGoal[0] === r &&
                state.winningGoal[1] === c &&
                state.winningPiece !== null) {
              drawPiece(rect, state.winningPiece, false, state.winner);
            } else if (legalLookup.has(key)) {
              drawMoveMarker(rect, legalLookup.get(key));
              drawTextCenter("★", rect, { size: 24, bold: true, color: TEXT_COLOR });
            } else {
              drawTextCenter("★", rect, { size: 24, bold: true, color: TEXT_COLOR });
            }
          } else if (cell === ROCK) {
            drawTextCenter("#", rect, { size: 24, bold: true, color: [230, 230, 230] });
          } else if (cell !== EMPTY) {
            drawPiece(rect, cell, state.liftMode, state.currentTurn);
          }

          if (legalLookup.has(key) && cell !== GOAL) {
            drawMoveMarker(rect, legalLookup.get(key));
          }
        }
      }

      for (let c = 0; c < COLS; c++) {
        const rect = boardToScreen(0, c);
        drawText(String(c), rect.x + rect.w / 2, TOP_UI + 10, {
          size: 18,
          color: TEXT_COLOR,
          align: "center",
          baseline: "middle"
        });
      }

      for (let r = 0; r < ROWS; r++) {
        const rect = boardToScreen(r, 0);
        drawText(String(r), 12, rect.y + rect.h / 2, {
          size: 18,
          color: TEXT_COLOR,
          align: "center",
          baseline: "middle"
        });
      }

      if (controls.activeInput) {
        const rect = controls.activeInput === "a" ? controls.inputA : controls.inputB;
        const current = controls.activeInput === "a" ? aText : bText;
        const metrics = (() => {
          ctx.save();
          ctx.font = `400 18px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
          const m = ctx.measureText(current);
          ctx.restore();
          return m.width;
        })();

        const cx = Math.min(rect.x + 10 + metrics + 2, rect.x + rect.w - 8);
        ctx.strokeStyle = "#202020";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx, rect.y + 7);
        ctx.lineTo(cx, rect.y + rect.h - 7);
        ctx.stroke();
      }
    }

    // =========================
    // Interaction
    // =========================
    function setSelected(r, c) {
      state.selected = [r, c];
      state.legalMoves = getLegalMoves(state.board, r, c, state.liftMode);
    }

    function clearSelected() {
      state.selected = null;
      state.legalMoves = [];
    }

    function handleButton(name) {
      try {
        if (name === "random_a") {
          aGrid = randomGrid();
          aText = String(displayLayoutNumber(aGrid, "A"));
          if (mirrorB) {
            bGrid = mirrorLR(aGrid);
            bText = String(displayLayoutNumber(bGrid, "B"));
          }
        } else if (name === "random_b") {
          if (mirrorB) mirrorB = false;
          bGrid = randomGrid();
          bText = String(displayLayoutNumber(bGrid, "B"));
        } else if (name === "mirror_b") {
          mirrorB = !mirrorB;
          if (mirrorB) {
            aGrid = parseLayoutSpec(aText);
            aText = String(displayLayoutNumber(aGrid, "A"));
            bGrid = mirrorLR(aGrid);
            bText = String(displayLayoutNumber(bGrid, "B"));
          }
        } else if (name === "number") {
          aGrid = parseLayoutSpec(aText);
          aText = String(displayLayoutNumber(aGrid, "A"));
          bText = String(displayLayoutNumber(bGrid, "B"));
        } else if (name === "string") {
          const [ag, bg] = resolveInputPair(aText, bText, false);
          aText = gridToText(ag);
          bText = gridToText(bg);
        } else if (name === "apply") {
          [aGrid, bGrid] = resolveInputPair(aText, bText, mirrorB);
          state = resetGame(aGrid, bGrid);
        } else if (name === "lift" && state.winner === null) {
          state.liftMode = !state.liftMode;
          if (state.selected) {
            const [r, c] = state.selected;
            state.legalMoves = getLegalMoves(state.board, r, c, state.liftMode);
          }
        } else if (name === "reset") {
          state = resetGame(aGrid, bGrid);
        }
        errorMsg = "";
      } catch (e) {
        errorMsg = e.message || String(e);
      }
      drawBoard();
    }

    function handleBoardClick(r, c) {
      if (state.winner !== null) return;

      const cell = state.board[r][c];

      if (!state.selected) {
        if (isPiece(cell) && sideOf(cell) === state.currentTurn) {
          setSelected(r, c);
        }
      } else {
        let chosen = null;
        for (const mv of state.legalMoves) {
          if (mv.to[0] === r && mv.to[1] === c) {
            chosen = mv;
            break;
          }
        }

        if (chosen) {
          const [srcR, srcC] = state.selected;
          const movingCell = state.board[srcR][srcC];
          const [newBoard, winner] = applyMove(state.board, state.selected, chosen, state.liftMode);
          state.board = newBoard;
          state.winner = winner;

          if (state.winner !== null) {
            state.winningPiece = winningDisplayPiece(movingCell, chosen.kind);
            state.winningGoal = chosen.to;
          }

          clearSelected();
          state.liftMode = false;

          if (state.winner === null) {
            state.currentTurn *= -1;
          }
        } else {
          if (isPiece(cell) && sideOf(cell) === state.currentTurn) {
            setSelected(r, c);
          } else {
            clearSelected();
          }
        }
      }

      drawBoard();
    }

    canvas.addEventListener("mousedown", (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * canvas.width / rect.width;
      const y = (e.clientY - rect.top) * canvas.height / rect.height;

      if (pointInRect(x, y, controls.inputA)) {
        controls.activeInput = "a";
        drawBoard();
        return;
      }
      if (pointInRect(x, y, controls.inputB)) {
        controls.activeInput = "b";
        drawBoard();
        return;
      }

      controls.activeInput = null;

      for (const [name, brect] of Object.entries(controls.buttons)) {
        if (pointInRect(x, y, brect)) {
          handleButton(name);
          return;
        }
      }

      const posRC = screenToBoard(x, y);
      if (!posRC) {
        drawBoard();
        return;
      }

      handleBoardClick(posRC[0], posRC[1]);
    });

    window.addEventListener("keydown", (e) => {
      if (controls.activeInput) {
        const key = controls.activeInput;

        if (e.key === "Backspace") {
          e.preventDefault();
          if (key === "a") {
            aText = aText.slice(0, -1);
          } else {
            bText = bText.slice(0, -1);
          }
        } else if (e.key === "Enter") {
          e.preventDefault();
          try {
            [aGrid, bGrid] = resolveInputPair(aText, bText, mirrorB);
            state = resetGame(aGrid, bGrid);
            errorMsg = "";
          } catch (err) {
            errorMsg = err.message || String(err);
          }
        } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          if (key === "a") {
            aText += e.key;
          } else {
            bText += e.key;
          }
        }

        if (key === "a") {
          if (mirrorB) {
            try {
              aGrid = parseLayoutSpec(aText);
              bGrid = mirrorLR(aGrid);
              bText = String(displayLayoutNumber(bGrid, "B"));
              errorMsg = "";
            } catch (_) {}
          }
        }

        drawBoard();
        return;
      }

      if (e.key === "r" || e.key === "R") {
        state = resetGame(aGrid, bGrid);
        drawBoard();
      } else if ((e.key === "l" || e.key === "L") && state.winner === null) {
        state.liftMode = !state.liftMode;
        if (state.selected) {
          const [r, c] = state.selected;
          state.legalMoves = getLegalMoves(state.board, r, c, state.liftMode);
        }
        drawBoard();
      }
    });

    // =========================
    // Initial render
    // =========================
    drawBoard();
  </script>
</body>
