<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Connect 4 + 3-player variant</title>
  <style>
    html, body { margin:0; padding:0; background:#f5f5f5; }
    canvas {
      display:block;
      margin:0 auto;
      background:#f5f5f5;
      touch-action: none; /* allow pointer events on mobile */
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>

<script>
(() => {
  // -----------------------------
  // Config (internal parameters)
  // -----------------------------
  const COLS = 7;
  const ROWS = 6;

  const WIN_2P = 4;
  const WIN_3P_HV = 3;
  const WIN_3P_D  = 4;

  // -----------------------------
  // UI constants
  // -----------------------------
  const CELL = 86;
  const MARGIN = 30;
  const TOPBAR = 110;
  const PANEL_W = 260;

  const BOARD_W = COLS * CELL;
  const BOARD_H = ROWS * CELL;
  const W = MARGIN * 2 + BOARD_W + PANEL_W;
  const H = MARGIN * 2 + TOPBAR + BOARD_H;

  // Colors
  const BG = [245, 245, 245];
  const TEXT = [20, 20, 20];
  const MUTED = [90, 90, 90];

  const BOARD_BG = [180, 180, 180];
  const HOLE = [235, 235, 235];
  const GRID_LINE = [24, 24, 24];

  const BTN_BG = [235, 235, 235];
  const BTN_BG_H = [220, 235, 255];
  const BTN_BORDER = [80, 80, 80];

  const P_COLORS = {
    1: [220, 45, 45],    // red
    2: [45, 110, 220],   // blue
    3: [240, 200, 40],   // yellow
  };

  // -----------------------------
  // Canvas setup (HiDPI)
  // -----------------------------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  let DPR = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  let scale = 1;         // fit-to-window scale
  let offsetX = 0;       // center the logical canvas
  let offsetY = 0;

  function resize() {
    DPR = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    // fit logical W x H into viewport
    scale = Math.min(vw / W, vh / H);
    scale = Math.min(1, scale); // keep crisp; remove this line if you want it to enlarge beyond 1

    const cssW = Math.floor(W * scale);
    const cssH = Math.floor(H * scale);

    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";

    canvas.width = Math.floor(cssW * DPR);
    canvas.height = Math.floor(cssH * DPR);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // draw in CSS pixels; then apply fit scale + center
    offsetX = Math.floor((cssW - W * scale) / 2);
    offsetY = Math.floor((cssH - H * scale) / 2);
  }

  window.addEventListener("resize", resize);
  resize();

  // -----------------------------
  // Helpers
  // -----------------------------
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const inside = (r, c) => (0 <= r && r < ROWS && 0 <= c && c < COLS);

  function rgb(arr) { return `rgb(${arr[0]},${arr[1]},${arr[2]})`; }

  function roundRect(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, Math.min(w, h) / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function boardToScreenXY(r, c) {
    const x0 = MARGIN;
    const y0 = MARGIN + TOPBAR;
    const cx = x0 + c * CELL + CELL / 2;
    const cy = y0 + r * CELL + CELL / 2;
    return [cx, cy];
  }

  function colFromMouse(mxLogical) {
    const x0 = MARGIN;
    if (mxLogical < x0 || mxLogical >= x0 + BOARD_W) return null;
    const c = Math.floor((mxLogical - x0) / CELL);
    return (0 <= c && c < COLS) ? c : null;
  }

  function firstEmptyRow(board, col) {
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][col] === 0) return r;
    }
    return null;
  }

  function hvdWinLengths(numPlayers) {
    if (numPlayers === 2) return [WIN_2P, WIN_2P, WIN_2P];
    return [WIN_3P_HV, WIN_3P_HV, WIN_3P_D];
  }

  function checkWinner(board, numPlayers) {
    const [hwin, vwin, dwin] = hvdWinLengths(numPlayers);

    const dirs = [
      [0,  1, hwin], // horizontal
      [1,  0, vwin], // vertical
      [1,  1, dwin], // diag down-right
      [1, -1, dwin], // diag down-left
    ];

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const p = board[r][c];
        if (p === 0) continue;

        for (const [dr, dc, need] of dirs) {
          let ok = true;
          for (let k = 1; k < need; k++) {
            const rr = r + dr * k;
            const cc = c + dc * k;
            if (!inside(rr, cc) || board[rr][cc] !== p) { ok = false; break; }
          }
          if (ok) return p;
        }
      }
    }
    return 0;
  }

  function isDraw(board) {
    for (let c = 0; c < COLS; c++) {
      if (firstEmptyRow(board, c) !== null) return false;
    }
    return true;
  }

  // -----------------------------
  // UI: Button
  // -----------------------------
  class Button {
    constructor(x, y, w, h, label, fontPx=28) {
      this.x=x; this.y=y; this.w=w; this.h=h;
      this.label=label;
      this.fontPx=fontPx;
      this.hover=false;
    }
    contains(px, py) {
      return (this.x <= px && px <= this.x + this.w && this.y <= py && py <= this.y + this.h);
    }
    draw() {
      ctx.save();
      roundRect(this.x, this.y, this.w, this.h, 12);
      ctx.fillStyle = rgb(this.hover ? BTN_BG_H : BTN_BG);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = rgb(BTN_BORDER);
      ctx.stroke();

      ctx.fillStyle = rgb(TEXT);
      ctx.font = `bold ${this.fontPx}px "Segoe UI", system-ui, -apple-system, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(this.label, this.x + this.w/2, this.y + this.h/2);
      ctx.restore();
    }
  }

  // -----------------------------
  // Game state
  // -----------------------------
  function newBoard() {
    return Array.from({length: ROWS}, () => Array(COLS).fill(0));
  }

  let state = "menu"; // "menu" | "game"
  let numPlayers = 2;
  let modeLabel = "";
  let board = newBoard();
  let turnPlayer = 1;
  let winner = 0;
  let drawFlag = false;
  let hoverCol = null;

  function resetGame(keepMode=true) {
    board = newBoard();
    turnPlayer = 1;
    winner = 0;
    drawFlag = false;
    if (keepMode) modeLabel = (numPlayers === 2) ? "2P" : "3P";
  }

  // Buttons: menu
  const btn2 = new Button(W/2 - 170, H/2 - 30, 340, 64, "2 Players", 28);
  const btn3 = new Button(W/2 - 170, H/2 + 55, 340, 64, "3 Players", 28);

  // Buttons: in-game
  const restartBtn = new Button(MARGIN*2 + BOARD_W + 30, H - MARGIN - 120, PANEL_W - 60, 48, "Restart", 28);
  const newGameBtn = new Button(MARGIN*2 + BOARD_W + 30, H - MARGIN - 60,  PANEL_W - 60, 48, "New Game", 28);

  // -----------------------------
  // Drawing
  // -----------------------------
  function drawBoard() {
    const x0 = MARGIN, y0 = MARGIN + TOPBAR;

    ctx.save();
    roundRect(x0, y0, BOARD_W, BOARD_H, 18);
    ctx.fillStyle = rgb(BOARD_BG);
    ctx.fill();

    const radius = CELL/2 - 10;

    // holes + pieces
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const [cx, cy] = boardToScreenXY(r, c);

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI*2);
        ctx.fillStyle = rgb(HOLE);
        ctx.fill();

        const p = board[r][c];
        if (p !== 0) {
          ctx.beginPath();
          ctx.arc(cx, cy, radius - 2, 0, Math.PI*2);
          ctx.fillStyle = rgb(P_COLORS[p]);
          ctx.fill();
        }
      }
    }

    // grid lines
    ctx.lineWidth = 2;
    ctx.strokeStyle = rgb(GRID_LINE);

    for (let c = 1; c < COLS; c++) {
      const x = x0 + c * CELL;
      ctx.beginPath();
      ctx.moveTo(x, y0 + 10);
      ctx.lineTo(x, y0 + BOARD_H - 10);
      ctx.stroke();
    }
    for (let r = 1; r < ROWS; r++) {
      const y = y0 + r * CELL;
      ctx.beginPath();
      ctx.moveTo(x0 + 10, y);
      ctx.lineTo(x0 + BOARD_W - 10, y);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawDropHints() {
    const radius = CELL/2 - 10;

    // landing hints
    for (let c = 0; c < COLS; c++) {
      const r = firstEmptyRow(board, c);
      if (r === null) continue;
      const [cx, cy] = boardToScreenXY(r, c);
      ctx.beginPath();
      ctx.arc(cx, cy, radius - 2, 0, Math.PI*2);
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgb(30,30,30)";
      ctx.stroke();
    }

    // ghost preview in top bar
    if (hoverCol !== null) {
      const r = firstEmptyRow(board, hoverCol);
      if (r !== null && !winner && !drawFlag && state === "game") {
        const x0 = MARGIN;
        const cx = x0 + hoverCol * CELL + CELL/2;
        const cy = MARGIN + TOPBAR/2 + 10;
        ctx.beginPath();
        ctx.arc(cx, cy, radius - 2, 0, Math.PI*2);
        ctx.lineWidth = 3;
        ctx.strokeStyle = "rgb(20,20,20)";
        ctx.stroke();
      }
    }
  }

  function drawSidePanel() {
    const px = MARGIN*2 + BOARD_W;
    const py = MARGIN;

    ctx.save();
    roundRect(px, py, PANEL_W, H - 2*MARGIN, 16);
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgb(210,210,210)";
    ctx.stroke();

    let y = py + 18;

    // title
    ctx.fillStyle = rgb(TEXT);
    ctx.font = `bold 28px "Segoe UI", system-ui, -apple-system, sans-serif`;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText("Connect", px + 18, y);
    y += 42;

    ctx.fillStyle = rgb(MUTED);
    ctx.font = `18px "Segoe UI", system-ui, -apple-system, sans-serif`;
    ctx.fillText(`Mode: ${modeLabel}`, px + 18, y); y += 28;
    ctx.fillText(`Board: ${COLS} x ${ROWS}`, px + 18, y); y += 28;

    // rule
    let rule = (numPlayers === 2)
       ? `Win: ${WIN_2P} any`
       : `Win: HV ${WIN_3P_HV}, D ${WIN_3P_D}`;
     ctx.fillText(rule, px + 18, y); y += 36;
    y += 12;

    // status
    ctx.fillStyle = rgb(TEXT);
    ctx.font = `bold 28px "Segoe UI", system-ui, -apple-system, sans-serif`;

    if (winner) {
      ctx.fillText(`Winner: Player ${winner}`, px + 18, y);
      y += 40;
    } else if (drawFlag) {
      ctx.fillText("Draw!", px + 18, y);
      y += 40;
    } else {
      ctx.fillText(`Turn: Player ${turnPlayer}`, px + 18, y);
      y += 14;

      // color swatch
      ctx.beginPath();
      ctx.arc(px + 56, y + 34, 18, 0, Math.PI*2);
      ctx.fillStyle = rgb(P_COLORS[turnPlayer]);
      ctx.fill();
      y += 60;
    }

    ctx.restore();

    restartBtn.draw();
    newGameBtn.draw();
  }

  function drawTopBar() {
    const x = MARGIN, y = MARGIN, w = BOARD_W, h = TOPBAR - 10;

    ctx.save();
    roundRect(x, y, w, h, 16);
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgb(220,220,220)";
    ctx.stroke();

    let msg;
    if (winner) msg = `Player ${winner} wins!`;
    else if (drawFlag) msg = "Draw!";
    else msg = `Player ${turnPlayer}'s turn`;

    ctx.fillStyle = rgb(TEXT);
    ctx.font = `bold 28px "Segoe UI", system-ui, -apple-system, sans-serif`;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText(msg, x + 18, y + 18);

    if (!winner && !drawFlag) {
      ctx.beginPath();
      ctx.arc(x + 54, y + 74, 18, 0, Math.PI*2);
      ctx.fillStyle = rgb(P_COLORS[turnPlayer]);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawMenu() {
    ctx.save();
    ctx.fillStyle = rgb(TEXT);
    ctx.textAlign = "center";

    ctx.font = `bold 44px "Segoe UI", system-ui, -apple-system, sans-serif`;
    ctx.textBaseline = "middle";
    ctx.fillText("Connect 4", W/2, H/2 - 110);

    ctx.fillStyle = rgb(MUTED);
    ctx.font = `18px "Segoe UI", system-ui, -apple-system, sans-serif`;
    ctx.fillText("Choose players", W/2, H/2 - 70);

    btn2.draw();
    btn3.draw();

    // Keep or delete note
    ctx.fillStyle = rgb(MUTED);
    ctx.font = `18px "Segoe UI", system-ui, -apple-system, sans-serif`;
    ctx.fillText("Tip: 3-player variant uses H/V=3, Diagonal=4.", W/2, H/2 + 150);

    ctx.restore();
  }

  function render() {
    // clear background
    ctx.save();
    // map logical -> CSS pixels with centering
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, canvas.width / DPR, canvas.height / DPR);

    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, scale);

    // background fill (logical)
    ctx.fillStyle = rgb(BG);
    ctx.fillRect(0, 0, W, H);

    if (state === "menu") {
      drawMenu();
    } else {
      drawTopBar();
      drawBoard();
      drawDropHints();
      drawSidePanel();
    }

    ctx.restore();
    requestAnimationFrame(render);
  }

  // -----------------------------
  // Input (mouse + touch via pointer)
  // -----------------------------
  function toLogicalCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const cssX = (clientX - rect.left);
    const cssY = (clientY - rect.top);

    // undo centering + scale to get logical
    const x = (cssX - offsetX) / scale;
    const y = (cssY - offsetY) / scale;
    return [x, y];
  }

  function updateHover(px, py) {
    if (state === "menu") {
      btn2.hover = btn2.contains(px, py);
      btn3.hover = btn3.contains(px, py);
      hoverCol = null;
    } else {
      restartBtn.hover = restartBtn.contains(px, py);
      newGameBtn.hover = newGameBtn.contains(px, py);

      const c = colFromMouse(px);
      hoverCol = c;
    }
  }

  function handleClick(px, py) {
    if (state === "menu") {
      if (btn2.contains(px, py)) {
        numPlayers = 2;
        modeLabel = "2P";
        resetGame(true);
        state = "game";
        return;
      }
      if (btn3.contains(px, py)) {
        numPlayers = 3;
        modeLabel = "3P";
        resetGame(true);
        state = "game";
        return;
      }
      return;
    }

    // in-game buttons
    if (restartBtn.contains(px, py)) { resetGame(true); return; }
    if (newGameBtn.contains(px, py)) { state = "menu"; return; }

    // if ended, ignore board clicks
    if (winner || drawFlag) return;

    const c = colFromMouse(px);
    if (c === null) return;

    const r = firstEmptyRow(board, c);
    if (r === null) return;

    board[r][c] = turnPlayer;

    winner = checkWinner(board, numPlayers);
    if (!winner && isDraw(board)) drawFlag = true;

    if (!winner && !drawFlag) {
      turnPlayer++;
      if (turnPlayer > numPlayers) turnPlayer = 1;
    }
  }

  canvas.addEventListener("pointermove", (e) => {
    const [x, y] = toLogicalCoords(e.clientX, e.clientY);
    updateHover(x, y);
  });

  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture?.(e.pointerId);
    const [x, y] = toLogicalCoords(e.clientX, e.clientY);
    updateHover(x, y);
    handleClick(x, y);
    e.preventDefault();
  });

  canvas.addEventListener("pointerleave", () => {
    // clear hover when leaving canvas
    btn2.hover = btn3.hover = false;
    restartBtn.hover = newGameBtn.hover = false;
    hoverCol = null;
  });

  // Start
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
